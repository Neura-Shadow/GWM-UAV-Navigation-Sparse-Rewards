# Corner Case: Slippery surface with wind disturbance
# Tests domain randomization with challenging physics
#
# This scenario exercises the domain randomization pipeline by specifying
# ranges for wind speed, sensor noise, surface friction, and obstacle
# placement noise.  It models a corridor environment where wind gusts
# perturb the UAV trajectory, requiring robust control.

scenario:
  id: "corner_case_slip"
  description: "UAV navigating through corridor with wind gusts and slippery surfaces"

domain_randomization:
  num_variations: 20
  wind_speed_range: [3.0, 8.0]        # m/s
  sensor_noise_range: [0.05, 0.15]     # noise std-dev
  friction_range: [0.3, 0.7]           # surface friction coefficient
  obstacle_position_noise: 3.0         # metres random offset

env:
  type: "mock"
  obstacles:
    - position: [15.0, 0.0, -5.0]
      radius: 2.5
    - position: [25.0, 2.0, -5.0]
      radius: 2.0
    - position: [35.0, -1.0, -5.0]
      radius: 3.0

goal:
  x: 40.0
  y: 0.0
  z: -5.0

safety:
  min_obstacle_dist: 5.0               # increased for safety margin
  uncertainty_threshold: 0.5           # more conservative
