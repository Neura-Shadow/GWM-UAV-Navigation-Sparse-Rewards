# ============================================================================
# Phase 5-A Runtime Capability Detection Configuration
# ============================================================================
# Read-only probes only. This configuration must not launch Isaac Sim, ROS2,
# MAVSDK, PX4 SITL, or hardware interfaces.

runtime_validation:
  write_report: true
  output_dir: outputs/runtime_validation
  include_path_hints: true
  redact_sensitive_env: true
  isaac_runtime_smoke:
    enabled: false
    frames: 3
    headless: true
    timeout_sec: 30.0
    output_path: outputs/runtime_validation/isaac_runtime_smoke.json
    write_output: true
    fail_on_unavailable: false
    descriptor_path: null
    required_env_gates:
      - GWM_RUN_ISAAC_RUNTIME_TESTS
      - GWM_ALLOW_OPTIONAL_RUNTIME
  isaac_sensor_runtime:
    enabled: false
    frames: 5
    headless: true
    timeout_sec: 60.0
    output_path: outputs/runtime_validation/isaac_sensor_runtime.json
    write_output: true
    fail_on_unavailable: false
    descriptor_path: null
    context_length: 3
    image_height: 32
    image_width: 32
    timestep: 0.05
    required_env_gates:
      - GWM_ALLOW_OPTIONAL_RUNTIME
      - GWM_RUN_ISAAC_RUNTIME_TESTS
  ros2_sensor_sync_smoke:
    enabled: false
    packets: 1
    timeout_sec: 30.0
    output_path: outputs/runtime_validation/ros2_sensor_sync_smoke.json
    write_output: true
    fail_on_unavailable: false
    slop_sec: 0.05
    queue_size: 10
    required_env_gates:
      - GWM_RUN_ROS2_SENSOR_SYNC_TESTS
      - GWM_ALLOW_OPTIONAL_RUNTIME
  ros2_sim_sensor_bridge:
    enabled: false
    frames: 3
    timeout_sec: 30.0
    output_path: outputs/runtime_validation/ros2_sim_sensor_bridge.json
    write_output: true
    fail_on_unavailable: false
    slop_sec: 0.05
    queue_size: 10
    context_length: 3
    image_height: 32
    image_width: 32
    node_name: gwm_phase6_ros2_sim_sensor_bridge
    publish_rate_hz: 20.0
    include_imu: true
    use_live_topics: false
    allow_headerless: false
    required_env_gates:
      - GWM_ALLOW_OPTIONAL_RUNTIME
      - GWM_RUN_ROS2_SENSOR_SYNC_TESTS
    optional_env_gates:
      - GWM_ROS2_LIVE_TOPICS
  mavsdk_sitl_smoke:
    enabled: false
    commands: 1
    timeout_sec: 30.0
    output_path: outputs/runtime_validation/mavsdk_sitl_smoke.json
    write_output: true
    fail_on_unavailable: false
    connection_url: "udp://:14540"
    autopilot: "px4"
    takeoff_altitude_m: 5.0
    health_timeout_sec: 10.0
    required_env_gates:
      - GWM_RUN_MAVSDK_SITL_TESTS
      - GWM_ALLOW_OPTIONAL_RUNTIME
      - GWM_ALLOW_SITL_COMMANDS
  px4_sitl_command_validation:
    enabled: false
    commands: 1
    timeout_sec: 30.0
    output_path: outputs/runtime_validation/px4_sitl_command_validation.json
    write_output: true
    fail_on_unavailable: false
    connection_url: "udp://:14540"
    autopilot: "px4"
    health_timeout_sec: 10.0
    takeoff_altitude_m: 5.0
    allow_arm: false
    land_after_validation: true
    command:
      vx: 0.25
      vy: 0.0
      vz: 0.0
      yaw_rate: 0.0
      duration: 0.2
    validation_state:
      position: [0.0, 0.0, -5.0]
      altitude_m: 5.0
      obstacle_position: null
    deployment:
      mock: false
      sitl_enabled: true
      real_hardware_enabled: false
      autonomous_real_flight_enabled: false
    safety:
      min_obstacle_distance: 4.0
      limits:
        velocity_limits:
          max_vx: 4.0
          max_vy: 4.0
          max_vz: 2.0
          max_yaw_rate: 1.0
        altitude_bounds:
          min_altitude: 0.5
          max_altitude: 120.0
        geofence:
          enabled: false
          x: [-100.0, 100.0]
          y: [-100.0, 100.0]
          z: [-120.0, 0.0]
    required_env_gates:
      - GWM_ALLOW_OPTIONAL_RUNTIME
      - GWM_RUN_MAVSDK_SITL_TESTS
      - GWM_ALLOW_SITL_COMMANDS
  closed_loop_readiness:
    enabled: false
    steps: 5
    timeout_sec: 60.0
    output_path: outputs/runtime_validation/closed_loop_readiness.json
    write_output: true
    fail_on_unavailable: false
    require_prior_smokes: false
    prior_smoke_reports:
      isaac_runtime: outputs/runtime_validation/isaac_runtime_smoke.json
      ros2_sensor_sync: outputs/runtime_validation/ros2_sensor_sync_smoke.json
      mavsdk_px4_sitl: outputs/runtime_validation/mavsdk_sitl_smoke.json
    deployment:
      mock: true
      sitl_enabled: false
      real_hardware_enabled: false
      autonomous_real_flight_enabled: false
  probes:
    python: true
    cuda: true
    nvidia_smi: true
    isaac_sim: true
    ros2: true
    mavsdk: true
    px4: true
    github_cli: true
  safety:
    launch_runtimes: false
    connect_to_sitl: false
    connect_to_hardware: false
