# ===========================================================================
# Multi-Agent (Axis 4) configuration
# ===========================================================================

fleet:
  max_agents: 10
  default_vehicle_type: "uav"
  safety_radius: 5.0               # metres — closer than this → conflict

shared_map:
  bounds: [-100, -100, -50, 100, 100, 0]   # x_min, y_min, z_min, x_max, y_max, z_max
  resolution: 1.0                  # metres per grid cell
  time_window: 30.0                # seconds of history to keep
  cleanup_interval: 10.0           # seconds between automatic cleanups

communication:
  backend: "mock"                  # "mock" by default; ROS2DDSChannel remains optional
  ros2_topics:
    state_broadcast: "/fleet/agent_state"
    map_update: "/fleet/map_update"
    task_assignment: "/fleet/task_assignment"
    emergency_alert: "/fleet/emergency_alert"
  default_qos:
    reliability: "reliable"        # "reliable" or "best_effort"
    deadline_ms: 100.0
    latency_budget_ms: 50.0
    history_depth: 10
    lifespan_sec: 5.0
  simulated_latency_ms: 5.0       # mock channel latency
  message_drop_rate: 0.0           # probability of simulated message drop

coordination:
  strategy: "round_robin"          # "round_robin" or "priority"
  priority:
    battery_weight: 1.0
    distance_weight: 1.0
    capability_weight: 2.0
    load_weight: 1.0
  conflict_check_interval: 1.0    # seconds between conflict checks
  state_broadcast_interval: 0.5   # seconds between state broadcasts

shared_latent_map:
  enabled: false                   # opt-in; shared_map remains the default
  latent_dim: 32
  confidence_decay: 0.95
  merge_strategy: "weighted_average"
