# ============================================================================
# World Model Configuration (Axis 1)
# ============================================================================
# This file parameterises the latent world model: encoder, dynamics,
# predictor, uncertainty estimation, and policy intent mapping.

encoder:
  type: "mlp"                # "mlp" | "identity"
  input_dim: 8               # pose(3) + velocity(3) + dist_goal(1) + obstacle_dist(1)
  latent_dim: 32

dynamics:
  type: "mlp"                # "mlp" | "linear"
  latent_dim: 32
  action_dim: 3
  hidden_dim: 128

predictor:
  horizon: 12                # planning rollout steps
  obstacle_threshold: 4.0    # distance (m) below which collision risk ramps up

uncertainty:
  type: "threshold"          # "threshold" | "ensemble"
  ensemble_size: 5           # only used when type == "ensemble"

policy_intent:
  goal: [60.0, 20.0, -8.0]  # target waypoint (x, y, z) in world frame
  max_velocity: 4.0          # maximum desired speed (m/s)

training:
  batch_size: 128
  learning_rate: 1.0e-3
  train_after_steps: 40      # start training after this many transitions
  train_every: 4             # train once every N environment steps
  train_epochs: 2            # gradient updates per training call
  replay_buffer_size: 50000
  grad_clip_norm: 5.0
