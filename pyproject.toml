[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwm-uav-nav"
version = "0.1.0"
description = "World-Model-Guided Digital-Twin UAV Navigation Research Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
airsim = ["cosysairsim", "airsim"]
sitl = ["mavsdk"]
dev = [
    "pytest>=7.0",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "airsim_runtime: optional Cosys-AirSim primary / legacy AirSim fallback runtime smoke tests",
    "isaac_runtime: optional Isaac Sim runtime smoke tests",
    "gwm_demo_runtime: optional end-to-end GWM runtime smoke tests",
    "mavsdk_sitl: optional MAVSDK / PX4 SITL smoke tests",
    "runtime_detection: read-only runtime capability detection tests",
    "ros2_runtime: optional ROS2 runtime smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
